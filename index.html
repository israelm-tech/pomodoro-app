<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Configuração de Cores Customizadas no Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        focus: {
                            bg: '#1a1013',
                            card: '#2a171d',
                            primary: '#ef4444',
                            ring: '#f87171'
                        },
                        shortBreak: {
                            bg: '#0d1917',
                            card: '#142925',
                            primary: '#10b981',
                            ring: '#34d399'
                        },
                        longBreak: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            primary: '#3b82f6',
                            ring: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Suavizar transição de cores ao alternar modos */
        .theme-transition {
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease;
        }
        
        /* Circulo de Progresso SVG */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s ease-out, stroke 0.5s ease;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body id="app-body" class="bg-focus-bg text-slate-100 min-h-full flex flex-col justify-between p-4 sm:p-6 theme-transition">

    <!-- Header / Barra Superior -->
    <header class="max-w-md w-full mx-auto flex justify-between items-center py-2">
        <div class="flex items-center gap-2">
            <div class="p-2 rounded-xl bg-white/10 backdrop-blur-md">
                <i data-lucide="timer" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="font-bold text-xl tracking-wide">Pomodoro</h1>
        </div>

        <button id="sound-toggle" class="p-2 rounded-xl bg-white/10 active:scale-95 transition-transform" aria-label="Alternar Som">
            <i data-lucide="volume-2" id="sound-icon" class="w-5 h-5 text-slate-200"></i>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md w-full mx-auto flex-1 flex flex-col justify-center items-center my-4 gap-6">

        <!-- Seleção de Modos -->
        <div class="flex bg-black/30 p-1.5 rounded-2xl w-full justify-between gap-1 backdrop-blur-sm border border-white/5">
            <button onclick="setMode('focus')" id="btn-focus" class="mode-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 bg-red-500 text-white shadow-lg">
                Foco
            </button>
            <button onclick="setMode('shortBreak')" id="btn-shortBreak" class="mode-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white">
                Pausa Curta
            </button>
            <button onclick="setMode('longBreak')" id="btn-longBreak" class="mode-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white">
                Pausa Longa
            </button>
        </div>

        <!-- Timer SVG + Display -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 flex items-center justify-center my-2">
            <svg class="w-full h-full" viewBox="0 0 100 100">
                <!-- Círculo de fundo -->
                <circle
                    class="text-white/10"
                    stroke-width="6"
                    stroke="currentColor"
                    fill="transparent"
                    r="42"
                    cx="50"
                    cy="50"
                />
                <!-- Círculo de progresso -->
                <circle
                    id="progress-circle"
                    class="progress-ring__circle text-focus-primary"
                    stroke-width="6"
                    stroke-linecap="round"
                    stroke="currentColor"
                    fill="transparent"
                    r="42"
                    cx="50"
                    cy="50"
                />
            </svg>

            <!-- Texto do Timer -->
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="time-display" class="text-5xl sm:text-6xl font-extrabold tracking-tight font-mono">25:00</span>
                <span id="mode-label" class="text-xs uppercase tracking-widest text-slate-400 font-semibold mt-2">Hora de Focar!</span>
            </div>
        </div>

        <!-- Contadores de Ciclo -->
        <div class="flex items-center gap-6 bg-white/5 px-6 py-3 rounded-2xl border border-white/5">
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase font-medium">Ciclos</p>
                <p id="cycle-count" class="text-xl font-bold text-white">0</p>
            </div>
            <div class="h-6 w-px bg-white/10"></div>
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase font-medium">Foco Total</p>
                <p id="total-focus-time" class="text-xl font-bold text-white">0m</p>
            </div>
        </div>

        <!-- Controles de Ação -->
        <div class="flex items-center justify-center gap-4 w-full">
            <!-- Reset Button -->
            <button onclick="resetTimer()" class="p-4 rounded-2xl bg-white/10 hover:bg-white/15 active:scale-95 transition-all text-slate-300">
                <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
            </button>

            <!-- Play/Pause Button -->
            <button id="start-btn" onclick="toggleTimer()" class="flex-1 max-w-[180px] py-4 px-6 rounded-2xl bg-focus-primary text-white font-bold text-lg shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
                <i data-lucide="play" id="start-icon" class="w-6 h-6 fill-current"></i>
                <span id="start-text">INICIAR</span>
            </button>

            <!-- Skip Button -->
            <button onclick="skipTimer()" class="p-4 rounded-2xl bg-white/10 hover:bg-white/15 active:scale-95 transition-all text-slate-300">
                <i data-lucide="skip-forward" class="w-6 h-6"></i>
            </button>
        </div>

    </main>

    <!-- Rodapé informativo -->
    <footer class="max-w-md w-full mx-auto text-center py-2 text-xs text-slate-500">
        <p>Desenvolvido para máxima produtividade</p>
    </footer>

    <!-- Lógica em JS -->
    <script>
        // Configurações de Tempos (em minutos)
        const MODES = {
            focus: { time: 25, label: 'Hora de Focar!', colorClass: 'bg-focus-bg', primaryClass: 'text-focus-primary', btnClass: 'bg-red-500' },
            shortBreak: { time: 5, label: 'Pausa Curta', colorClass: 'bg-shortBreak-bg', primaryClass: 'text-shortBreak-primary', btnClass: 'bg-emerald-500' },
            longBreak: { time: 15, label: 'Pausa Longa', colorClass: 'bg-longBreak-bg', primaryClass: 'text-longBreak-primary', btnClass: 'bg-blue-500' }
        };

        // Estado da Aplicação
        let currentMode = 'focus';
        let timeLeft = MODES[currentMode].time * 60;
        let totalDuration = timeLeft;
        let isRunning = false;
        let timerInterval = null;
        let completedCycles = 0;
        let totalFocusMinutes = 0;
        let soundEnabled = true;

        // Elementos DOM
        const appBody = document.getElementById('app-body');
        const timeDisplay = document.getElementById('time-display');
        const modeLabel = document.getElementById('mode-label');
        const progressCircle = document.getElementById('progress-circle');
        const startBtn = document.getElementById('start-btn');
        const startIcon = document.getElementById('start-icon');
        const startText = document.getElementById('start-text');
        const cycleCountEl = document.getElementById('cycle-count');
        const totalFocusTimeEl = document.getElementById('total-focus-time');
        const soundToggleBtn = document.getElementById('sound-toggle');
        const soundIcon = document.getElementById('sound-icon');

        // Configuração do Circulo SVG
        const radius = progressCircle.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;

        // Inicializar Lucide Icons
        lucide.createIcons();

        // Web Audio API para Som de Alerta (Sem arquivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep() {
            if (!soundEnabled) return;
            
            // Garantir contexto de áudio ativo no mobile
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // Nota D5
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3); // Sobe para A5

            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // Alternador de Som
        soundToggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundIcon.setAttribute('data-lucide', soundEnabled ? 'volume-2' : 'volume-x');
            soundToggleBtn.classList.toggle('opacity-50', !soundEnabled);
            lucide.createIcons();
        });

        // Atualiza a interface do Timer
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            timeDisplay.textContent = formattedTime;
            document.title = `${formattedTime} - ${MODES[currentMode].label}`;

            // Atualiza barra circular de progresso
            const offset = circumference - (timeLeft / totalDuration) * circumference;
            progressCircle.style.strokeDashoffset = offset;
        }

        // Troca de Modo (Foco / Pausa Curta / Pausa Longa)
        function setMode(mode) {
            pauseTimer();
            currentMode = mode;
            timeLeft = MODES[mode].time * 60;
            totalDuration = timeLeft;

            // Atualizar visual do tema
            appBody.className = `${MODES[mode].colorClass} text-slate-100 min-h-full flex flex-col justify-between p-4 sm:p-6 theme-transition`;
            progressCircle.className.baseVal = `progress-ring__circle ${MODES[mode].primaryClass}`;
            startBtn.className = `flex-1 max-w-[180px] py-4 px-6 rounded-2xl ${MODES[mode].btnClass} text-white font-bold text-lg shadow-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2`;
            modeLabel.textContent = MODES[mode].label;

            // Atualizar botões do topo
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = 'mode-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white';
            });
            
            const activeBtn = document.getElementById(`btn-${mode}`);
            activeBtn.className = `mode-btn flex-1 py-2.5 px-3 rounded-xl text-xs sm:text-sm font-semibold transition-all duration-300 ${MODES[mode].btnClass} text-white shadow-lg`;

            updateDisplay();
        }

        // Play / Pause Toggle
        function toggleTimer() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            isRunning = true;
            startText.textContent = 'PAUSAR';
            startIcon.setAttribute('data-lucide', 'pause');
            lucide.createIcons();

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    handleTimerComplete();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            startText.textContent = 'INICIAR';
            startIcon.setAttribute('data-lucide', 'play');
            lucide.createIcons();
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = MODES[currentMode].time * 60;
            updateDisplay();
        }

        function skipTimer() {
            pauseTimer();
            handleTimerComplete(true);
        }

        // Trata fim do tempo ou pulo de etapa
        function handleTimerComplete(skipped = false) {
            pauseTimer();
            
            if (!skipped) {
                playBeep();
            }

            if (currentMode === 'focus') {
                completedCycles++;
                totalFocusMinutes += MODES.focus.time;
                cycleCountEl.textContent = completedCycles;
                totalFocusTimeEl.textContent = `${totalFocusMinutes}m`;

                // Alterna automaticamente para pausa longa a cada 4 ciclos
                if (completedCycles % 4 === 0) {
                    setMode('longBreak');
                } else {
                    setMode('shortBreak');
                }
            } else {
                setMode('focus');
            }
        }

        // Inicializar display
        updateDisplay();
    </script>
</body>
</html>
